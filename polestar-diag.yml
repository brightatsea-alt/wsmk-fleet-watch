name: Pole Star diagnostic
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run diagnostic
        env:
          POLESTAR_CLIENT_ID: ${{ secrets.POLESTAR_CLIENT_ID }}
          POLESTAR_CLIENT_SECRET: ${{ secrets.POLESTAR_CLIENT_SECRET }}
        run: node polestar-diag.js
