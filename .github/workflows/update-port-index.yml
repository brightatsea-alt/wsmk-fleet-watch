name: Update Port Index

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build port index
        run: python build_port_index.py
      - name: Commit if changed
        run: |
          git config user.name "port-index-bot"
          git config user.email "actions@github.com"
          git add ports-data.json
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "Port index update"
            git push
          fi
