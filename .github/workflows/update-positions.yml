name: Update Fleet Positions

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install ws --no-save

      - name: Collect AIS positions
        continue-on-error: true          # 한 소스 실패가 전체를 중단하지 않도록
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          COLLECT_SECONDS: "330"
        run: node collect.js

      - name: Collect Pole Star (Spire) positions
        continue-on-error: true
        env:
          POLESTAR_CLIENT_ID: ${{ secrets.POLESTAR_CLIENT_ID }}
          POLESTAR_CLIENT_SECRET: ${{ secrets.POLESTAR_CLIENT_SECRET }}
        run: node polestar-collect.js

      - name: Validate output
        run: |
          node -e "const d=require('./fleet-positions.json'); const n=Object.keys(d.vessels||{}).length; if(!n) { console.error('EMPTY position store'); process.exit(1); } console.log('OK: '+n+' vessels, updated '+d.updated);"

      - name: Commit and push if changed
        run: |
          git config user.name "fleet-bot"
          git config user.email "actions@github.com"
          git add fleet-positions.json polestar-positions.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Position update $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              echo "retry $i"; sleep 5
            done
          fi
