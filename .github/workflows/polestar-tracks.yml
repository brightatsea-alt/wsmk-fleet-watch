name: Pole Star tracks

on:
  schedule:
    - cron: '20 20 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: '전구간 재수집(60일) 여부'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tracks
  cancel-in-progress: false

jobs:
  tracks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect tracks
        env:
          POLESTAR_CLIENT_ID: ${{ secrets.POLESTAR_CLIENT_ID }}
          POLESTAR_CLIENT_SECRET: ${{ secrets.POLESTAR_CLIENT_SECRET }}
          BACKFILL_DAYS: '60'
          KEEP_DAYS: '60'
          FORCE_BACKFILL: ${{ github.event.inputs.backfill == 'true' && '1' || '0' }}
        run: node polestar-tracks.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add tracks
          if git diff --staged --quiet; then
            echo 'no change'
          else
            git commit -m 'tracks update'
            for i in 1 2 3; do git pull --rebase --autostash && git push && break; echo retry $i; sleep 5; done
          fi
