<!DOCTYPE html>
<html lang="ko"><head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='9' fill='%237ED321'/%3E%3Ctext x='32' y='45' font-family='Arial' font-size='31' font-weight='700' fill='%23111111' text-anchor='middle'%3EFW%3C/text%3E%3C/svg%3E">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advisory Sent Log — WSMK Fleet Watch</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
 :root{--bg:#0D1522;--panel:#131F30;--panel2:#0F1928;--line:#22334A;--text:#DCE6F2;--muted:#8CA0B8;--accent:#5AB8D6;--amber:#F0B95A;--red:#FF5A5A;--green:#5CE01E;--mono:'IBM Plex Mono',monospace;--cond:'Barlow Condensed',sans-serif}
 *{margin:0;padding:0;box-sizing:border-box}
 body{background:var(--bg);color:var(--text);font-family:-apple-system,'Malgun Gothic',sans-serif;font-size:14px;min-height:100vh}
 header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:10}
 .brand{font-family:var(--cond);font-weight:600;font-size:21px;letter-spacing:.06em;color:#fff}
 .brand small{color:var(--amber);font-size:12px;letter-spacing:.18em;margin-left:8px}
 a.back{margin-left:auto;color:var(--accent);font-family:var(--mono);font-size:12px;text-decoration:none;border:1px solid var(--line);padding:4px 10px;border-radius:4px}
 .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:var(--panel2);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--muted)}
 .bar select,.bar input{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:5px 8px;font-size:12px;font-family:var(--mono);outline:none}
 .sum{padding:9px 16px;font-family:var(--mono);font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line)}
 .sum b{color:var(--text)}
 .wrap{padding:12px 16px 40px}
 .card{background:var(--panel2);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:7px;padding:12px 14px;margin-bottom:10px}
 .card.must{border-left-color:var(--red)}
 .card.soon{border-left-color:var(--amber)}
 .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
 .hd h3{font-size:16px;font-weight:700;color:#F2F7FC}
 .hd .fg{font-family:var(--mono);font-size:10px;font-weight:700;background:#24384F;color:#BFD6E8;border-radius:3px;padding:1px 5px}
 .hd .fg.k{background:#0B4DA2;color:#fff}
 .hd .d{margin-left:auto;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--amber)}
 .hd .d.now{color:var(--red)}
 .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px;margin-top:9px;font-family:var(--mono);font-size:11.5px}
 .grid div span{color:var(--muted)}
 .must-box{margin-top:10px;border:1px solid var(--red);background:rgba(255,90,90,.08);border-radius:5px;padding:9px 11px}
 .must-box b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:#FF8A8A;margin-bottom:5px}
 .must-box ul{margin:0 0 0 17px;font-size:12px;line-height:1.7;color:#FFD9D9}
 .items{margin-top:9px;padding-top:8px;border-top:1px dashed rgba(90,184,214,.28);font-family:var(--mono);font-size:11px;color:#A7BACE;line-height:1.75}
 .items b{color:var(--accent)}
 .empty{padding:36px;text-align:center;color:var(--muted)}
 .mode{font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 7px;border-radius:3px}
 .mode.sent{background:#123B22;color:#7CFF9E}
 .mode.draft{background:#3B3312;color:#FFE080}
 .mode.fail{background:#3B1212;color:#FF8A8A}
 .rcpt{font-family:var(--mono);font-size:11px;color:#A7BACE;margin-top:8px;line-height:1.7}
 .rcpt span{color:var(--muted);margin-right:6px}
</style></head><body>
<header>
  <div class="brand">ADVISORY SENT LOG<small>WSM KOREA</small></div>
  <div style="font-family:var(--mono);font-size:11.5px;color:var(--muted)">선박에 실제 발송된 기항 통보</div>
  <a class="back" href="index.html">← Fleet Watch</a>
</header>
<div class="bar">
  기간 <select id="fday"><option value="7">최근 7일</option><option value="30" selected>최근 30일</option><option value="90">최근 90일</option><option value="9999">전체</option></select>
  <select id="fmode"><option value="">전체</option><option value="sent">발송 완료</option><option value="fail">실패</option></select>
  <select id="fvs"><option value="">선박 전체</option></select>
  <input id="fq" type="search" placeholder="선박·항구 검색" style="min-width:130px">
  <span id="upd" style="margin-left:auto"></span>
</div>
<div class="sum" id="sum">불러오는 중…</div>
<div class="wrap" id="list"></div>
<script>
var MUST={
 'USA':{t:'U.S. PORT CALL — MANDATORY ACTION',l:['Docmap › US & Americas Documentation 체크리스트 이행','California: Marine Invasive Species 보고','쓰레기 분리 — 음식물 혼입 시 CBP 벌금 사례']},
 'Argentina':{t:'ARGENTINE PORTS — CUSTOMS',l:['세관 규정 엄격 — 불완전·부정확·미신고 시 고액 벌금','페인트·화학품·면세품 중점 점검']},
 'Panama':{t:'PANAMA CANAL — PCSOPEP',l:['PCSOPEP 승인 필수 — 통항 96시간 전 제출','승인서 유효성 및 선내 비치 확인']},
 'Turkey':{t:'TURKISH PORTS — BUNKER DECLARATION & POLLUTION',l:['벙커 신고 정확성 — 과다신고 시 압류·공탁·형사처벌','오염 벌금은 GT 기준 (유출량 아님)','2025.1.1부터 약 44% 인상']}};
var ALIAS={'United States':'USA','Turkiye':'Turkey'};
function mustFor(c){ return MUST[ALIAS[c]||c]||null; }
var DATA=[], NOW=Date.now();
function fmt(ts){ var d=new Date(ts); if(isNaN(d)) return ts; return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function draw(){
  var days=parseFloat(document.getElementById("fday").value)||30;
  var mode=document.getElementById("fmode").value;
  var fvs=document.getElementById("fvs").value;
  var q=(document.getElementById("fq").value||"").toLowerCase();
  var rows=DATA.filter(function(r){
    if(r.mode==="test") return false;
    if((NOW-new Date(r.ts).getTime())/864e5 > days) return false;
    if(mode && r.mode!==mode) return false;
    if(fvs && r.vessel!==fvs) return false;
    if(q && (r.vessel+" "+r.port).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
  var nSent=rows.filter(function(r){return r.mode==="sent";}).length, nFail=rows.filter(function(r){return r.mode==="fail";}).length;
  document.getElementById("sum").innerHTML="발송 <b>"+nSent+"</b>건"+(nFail?" · 실패 <b style=\"color:#FF8A8A\">"+nFail+"</b>건":"")+" · 최근 "+(days>9000?"전체":days+"일");
  document.getElementById("list").innerHTML = rows.length? rows.map(function(r){
    var must=mustFor(r.country);
    var cls = r.mode==="fail" ? "must" : (must ? "must":"");
    var h="<div class=\"card "+cls+"\">"
      +"<div class=\"hd\"><h3>"+r.vessel+"</h3>"
      +"<span class=\"mode "+r.mode+"\">"+(r.mode==="sent"?"SENT":r.mode==="fail"?"FAILED":r.mode.toUpperCase())+"</span>"
      +"<span style=\"font-family:var(--mono);font-size:11.5px;color:var(--muted)\">"+r.port+" · "+(r.country||"—")+"</span>"
      +"<span class=\"d\">"+fmt(r.ts)+"</span></div>"
      +"<div class=\"grid\">"
      +"<div><span>ETA</span> "+(r.eta||"—")+"</div>"
      +"<div><span>항구 정보</span> "+(r.items!=null?r.items+"건":"—")+"</div>"
      +"<div><span>첨부</span> "+(r.attach||"—")+"</div>"
      +"</div>";
    if(r.subject) h+="<div class=\"rcpt\"><span>제목</span>"+r.subject+"</div>";
    if(r.to) h+="<div class=\"rcpt\"><span>수신</span>"+r.to+"<br><span>참조</span>"+(r.cc||"—")+"</div>";
    if(r.error) h+="<div class=\"rcpt\" style=\"color:#FF8A8A\"><span>오류</span>"+r.error+"</div>";
    if(must) h+="<div class=\"must-box\"><b>⚠ "+must.t+"</b><ul>"+must.l.map(function(x){return "<li>"+x+"</li>";}).join("")+"</ul></div>";
    return h+"</div>";
  }).join("") : "<div class=\"empty\">해당 기간에 발송된 통보가 없습니다</div>";
}
(async function(){
  try{
    var d=await (await fetch("sent-log.json?t="+Date.now())).json();
    DATA=(d.v||[]).filter(function(r){ return r && r.ts; });
    var vs=[]; DATA.forEach(function(r){ if(r.mode!=="test" && vs.indexOf(r.vessel)<0) vs.push(r.vessel); });
    var sv=document.getElementById("fvs");
    sv.innerHTML="<option value=\"\">선박 전체 ("+vs.length+")</option>"+vs.sort().map(function(v){return "<option value=\""+v+"\">"+v+"</option>";}).join("");
    sv.onchange=draw;
    document.getElementById("upd").textContent="이력 갱신 "+(d.u||"—")+" · "+DATA.filter(function(r){return r.mode!=="test";}).length+"건";
    draw();
  }catch(e){ document.getElementById("sum").textContent="이력 없음 — 아직 발송된 통보가 없습니다"; document.getElementById("list").innerHTML="<div class=\"empty\">첫 발송 후 이곳에 기록됩니다</div>"; }
})();
["fday","fmode"].forEach(function(id){ document.getElementById(id).onchange=draw; });
document.getElementById("fq").oninput=draw;
</script></body></html>
