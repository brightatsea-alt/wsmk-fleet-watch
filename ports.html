<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WSMK Port Information</title>
<style>
  :root{--bg:#0D1522;--panel:#131F30;--line:#22334A;--text:#DCE6F2;--muted:#8CA0B8;
        --accent:#5AB8D6;--gen:#5AB8D6;--sec:#E0703C;
        --mono:'IBM Plex Mono',ui-monospace,monospace}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,'Malgun Gothic',sans-serif;font-size:14px}
  header{padding:14px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:9}
  header h1{font-size:19px}
  header .sub{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:4px}
  .stats{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
  .stat{padding:3px 10px;border:1px solid var(--line);border-radius:4px;font-family:var(--mono);font-size:12px;background:var(--bg)}
  .stat b.g{color:var(--gen)} .stat b.s{color:var(--sec)}
  main{max-width:860px;margin:0 auto;padding:14px}
  .portsec{margin:16px 0 6px;font-size:15px;font-weight:700;color:var(--accent)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:11px 13px;margin:8px 0}
  .card .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  .badge{padding:1px 8px;border-radius:3px;font-size:10.5px;font-family:var(--mono);font-weight:700;color:#08121F}
  .badge.g{background:var(--gen)} .badge.s{background:var(--sec)}
  .ym{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .txt{line-height:1.55}
  .src{margin-top:7px;font-size:11.5px}
  .src a{color:var(--accent);text-decoration:none}
  .src a:hover{text-decoration:underline}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .brief{background:linear-gradient(135deg,#15263C,#111D2E);border:1px solid #2A4160;border-left:4px solid var(--accent);border-radius:8px;padding:14px 16px;margin:4px 0 14px;line-height:1.7}
  .brief h2{font-size:14px;color:var(--accent);margin-bottom:7px}
  .brief p{margin:5px 0;font-size:13.5px}
  .brief .hl{color:#F0B95A;font-weight:600}
  .brief .sec2{color:var(--sec);font-weight:600}
  .brief .gen2{color:var(--gen);font-weight:600}
  @media print{.brief{background:#f4f7fa;border-color:#88a;color:#111}.brief h2{color:#0a4d7a}.brief .hl{color:#8a6d1c}.brief .sec2{color:#c85a2e}.brief .gen2{color:#2b7fb8}}
  .note{font-size:11px;color:var(--muted);padding:10px 18px;border-top:1px solid var(--line);margin-top:20px}
  .tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .tools button{padding:6px 13px;border:1px solid var(--line);border-radius:5px;background:#1a6fb5;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer}
  .tools button.alt{background:var(--panel);color:var(--text)}
  .tools button:hover{filter:brightness(1.2)}
  @media print{
    body{background:#fff;color:#111}
    header{position:static;background:#fff;border-color:#ccc}
    .tools,.note{display:none}
    .card{background:#fff;border-color:#bbb;break-inside:avoid;color:#111}
    .stat{background:#fff;color:#111}
    .ym,.sub{color:#555} .txt{color:#111}
    .badge.g{background:#2b7fb8;color:#fff}.badge.s{background:#c85a2e;color:#fff}
    .portsec{color:#0a4d7a}
    .src a{color:#0a4d7a}
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Port Information</h1>
  <div class="sub" id="sub">로딩 중…</div>
  <div class="stats" id="stats"></div>
  <div class="tools">
    <button class="alt" id="langbtn" onclick="toggleLang()" style="border-color:var(--accent)">🌐 English</button>
    <select id="range" onchange="renderAll()" style="padding:6px 10px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--text);font-size:12.5px">
      <option value="0">기간: 전체</option>
      <option value="12">최근 12개월</option>
      <option value="6">최근 6개월</option>
    </select>
    <button id="bcsv" onclick="dlCSV()">⬇ CSV 다운로드</button>
    <button id="bdoc" onclick="dlDOC()">⬇ Word(.doc) 다운로드</button>
    <button class="alt" id="bprn" onclick="window.print()">🖨 인쇄 / PDF 저장</button>
  </div>
</header>
<main id="main"></main>
<div class="note">출처: WSMK Work Place / Port Information (월간 Port Information Update 등) · 원문 PDF는 각 항목의 링크로 열람 · 자동 인덱싱</div>
<script>
const q = new URLSearchParams(location.search);
const wantPort = q.get('port'), wantCountry = q.get('country');

let LANG = (q.get('lang')==='en') ? 'en' : 'ko';
function TXT(k,e){ return LANG==='ko' ? k : e; }
let KO = {};                      // 영문 원문 → 한글 번역 매핑
function koOf(t){
  if(KO[t]) return KO[t];
  for(const k in KO){ if(k.length>40 && t.startsWith(k)) return KO[k]+' '+t.slice(k.length); }
  return null;
}
function tr(t){ return LANG==='ko' ? koOf(t) : null; }

function applyChromeLang(){
  document.getElementById('langbtn').textContent = LANG==='ko' ? '🌐 English' : '🌐 한글';
  const r=document.getElementById('range');
  if(r){ r.options[0].text=TXT('기간: 전체','Range: All'); r.options[1].text=TXT('최근 12개월','Last 12 months'); r.options[2].text=TXT('최근 6개월','Last 6 months'); }
  const b1=document.getElementById('bcsv'), b2=document.getElementById('bdoc'), b3=document.getElementById('bprn');
  if(b1) b1.textContent=TXT('⬇ CSV 다운로드','⬇ Download CSV');
  if(b2) b2.textContent=TXT('⬇ Word(.doc) 다운로드','⬇ Download Word (.doc)');
  if(b3) b3.textContent=TXT('🖨 인쇄 / PDF 저장','🖨 Print / Save PDF');
}
function toggleLang(){
  LANG = LANG==='ko' ? 'en' : 'ko';
  applyChromeLang();
  renderAll();
}
applyChromeLang();

function cutoffYM(){
  const m = parseInt(document.getElementById('range')?.value||'0');
  if(!m) return null;
  const d = new Date(); d.setMonth(d.getMonth()-m);
  return d.toISOString().slice(0,7);
}
function applyCut(list){
  const c = cutoffYM();
  if(!c) return list;
  return list.map(p=>({...p, items:p.items.filter(i=>i.ym>=c)})).filter(p=>p.items.length);
}
function visibleEntries(){ const v=window.__view; return v?applyCut(v.entries):[]; }
function visibleCommon(){ const v=window.__view; return (v&&v.common)?applyCut(v.common):[]; }
function renderAll(){
  const v = window.__view; if(!v) return;
  const tt = window.__tmode==='port' ? v.title
           : window.__tmode==='country' ? (wantCountry + TXT(' — 국가 전체',' — Country overview'))
           : TXT('전체 항구 정보','All Ports Information');
  document.getElementById('title').textContent = '⚓ ' + tt;
  if(window.__meta){ const M=window.__meta;
    document.getElementById('sub').textContent = TXT(
      `항목 ${M.g+M.s}건 · 인덱스 생성 ${M.generated} · 데이터 기간 2024.02 ~ 최신 · 번역 ${M.ko}건`,
      `${M.g+M.s} items · index generated ${M.generated} · data 2024.02–latest · ${M.ko} translations`); }
  const entries = visibleEntries();
  const main = document.getElementById('main');
  const gAll = entries.reduce((a,p)=>a+p.items.filter(i=>i.cat==='general').length,0);
  const sAll = entries.reduce((a,p)=>a+p.items.filter(i=>i.cat==='security').length,0);
  document.getElementById('stats').innerHTML =
    `<span class="stat">${TXT('일반','General')} <b class="g">${gAll}</b></span><span class="stat">${TXT('보안','Security')} <b class="s">${sAll}</b></span><span class="stat">${TXT('항구','Ports')} ${entries.length}</span><span class="stat">${TXT('표시','Shown')} ${gAll+sAll}${TXT('건','')}${cutoffYM()?TXT(' (기간 필터)',' (range filter)'):''}</span>`;
  if(!entries.length){ main.innerHTML = '<div class="empty">'+TXT('선택한 기간에 해당하는 정보가 없습니다.','No information for the selected period.')+'</div>'; return; }
  window.__brief = makeBrief(tt, entries, v.isCountry);
  const briefBlock = `<div class="brief"><h2>📋 ${TXT('요약 설명','Summary')}</h2>${window.__brief}</div>`;
  main.innerHTML = briefBlock + entries.map(p=>{
    const items = p.items.map(i=>{
      const k = tr(i.text);
      const body = k ? k : i.text;
      const enTag = (LANG==='ko' && !k) ? ' <span class="ym">(EN)</span>' : '';
      return `
      <div class="card">
        <div class="top"><span class="badge ${i.cat==='security'?'s':'g'}">${i.cat==='security'?'SECURITY':'GENERAL'}</span><span class="ym">${i.ym}</span>${enTag}</div>
        <div class="txt">${body}</div>
        <div class="src">📄 <a href="${i.link}" target="_blank" rel="noopener">${i.src||TXT('원문 PDF','Source PDF')}</a></div>
      </div>`;}).join('');
    const head = (wantPort && entries.length===1) ? '' :
      `<div class="portsec">⚓ ${p.port} <span class="ym">(${p.country} · ${p.items.length}${TXT('건',' items')})</span></div>`;
    return head + items;
  }).join('') + commonBlock() + sourcesBlock();
}
function cardHTML(i){
  const k = tr(i.text);
  const body = k ? k : i.text;
  const enTag = (LANG==='ko' && !k) ? ' <span class="ym">(EN)</span>' : '';
  return `<div class="card">
    <div class="top"><span class="badge ${i.cat==='security'?'s':'g'}">${i.cat==='security'?'SECURITY':'GENERAL'}</span><span class="ym">${i.ym}</span>${enTag}</div>
    <div class="txt">${body}</div>
    <div class="src">📄 <a href="${i.link}" target="_blank" rel="noopener">${i.src||TXT('원문 PDF','Source PDF')}</a></div>
  </div>`;
}
function commonBlock(){
  const cm = visibleCommon();
  if(!cm.length) return '';
  return cm.map(p=>
    `<div class="portsec">🌏 ${p.port} <span class="ym">(${p.country} ${TXT('국가 공통','country-wide')} · ${p.items.length}${TXT('건',' items')})</span></div>` +
    p.items.map(cardHTML).join('')
  ).join('');
}
const REGION = {
  asia:['Singapore','Indonesia','Malaysia','Philippines','Bangladesh','India','China','Vietnam','Thailand','Hong Kong'],
  wafr:['Nigeria','Ghana','Togo','Benin',"Cote d'Ivoire","Côte d'Ivoire",'Ivory Coast','Guinea','Liberia','Gabon','Angola','Cameroon','Sao Tome and Principe','Equatorial Guinea'],
  io:['Yemen','Somalia','Djibouti','Oman','UAE','United Arab Emirates','Saudi Arabia','Qatar','Bahrain','Egypt','Kenya','Mozambique','Tanzania']
};
function sourcesBlock(){
  const v = window.__view; if(!v) return '';
  const cn = (v.entries[0]||{}).country || '';
  const pn = wantPort || '';
  const inR = r => REGION[r].some(x=>cn.indexOf(x)>=0);
  const rec = r => inR(r) ? ' <span class="hl">'+TXT('★권장','★recommended')+'</span>' : '';
  const L = (u,t,d)=>`<div style="margin:4px 0">🔗 <a href="${u}" target="_blank" rel="noopener" style="color:var(--accent)">${t}</a> <span class="ym">— ${d}</span></div>`;
  let sec = '';
  sec += L('https://www.recaap.org/','ReCAAP ISC',TXT('아시아 해적·강도 사고 속보/주간보고','Asia piracy/robbery alerts & weekly reports')+rec('asia'));
  sec += L('https://gog-mdat.org/home','MDAT-GoG',TXT('기니만(서아프리카) 해상보안 경보','Gulf of Guinea maritime security alerts')+rec('wafr'));
  sec += L('https://www.ukmto.org/','UKMTO',TXT('인도양·중동 VRA 경보 (Q6099)','Indian Ocean/Middle East VRA alerts (Q6099)')+rec('io'));
  sec += L('https://on-shore.mschoa.org/','MSCHOA',TXT('아프리카의 뿔 해역 그룹통항·등록','Horn of Africa group transits & registration')+rec('io'));
  sec += L('https://icc-ccs.org/imb-piracy-reporting-centre-2/','IMB Piracy Reporting Centre',TXT('전세계 해적신고센터(24h)','Global piracy reporting centre (24h)'));
  sec += L('https://www.maritime.dot.gov/msci','US MARAD MSCI',TXT('미국 해사 경보·권고문','US maritime alerts & advisories'));
  let pi = '';
  pi += L('https://www.findaport.com/','Findaport (Guide to Port Entry)',TXT('항만 입항 상세정보 데이터베이스','Port entry details database'));
  pi += L('https://msi.nga.mil/Publications/WPI','NGA World Port Index (Pub.150)',TXT('공식 세계 항만 색인·시설 데이터','Official world port index & facility data'));
  pi += L('https://www.vesselfinder.com/ports'+(pn?('?name='+encodeURIComponent(pn)):''),'VesselFinder Ports'+(pn?` — "${pn}"`:''),TXT('항만 위치·입출항 선박 현황','Port locations & vessel movements'));
  pi += L('https://portwatch.imf.org/','IMF PortWatch',TXT('항만 혼잡·물동량 모니터링','Port congestion & throughput monitoring'));
  if(pn) pi += L('https://news.google.com/search?q='+encodeURIComponent('"'+pn+'" port'),'Google News — "'+pn+'"',TXT('해당 항구 최신 뉴스 검색','Latest news for this port'));
  return `<div class="brief" style="border-left-color:#7A9E5A;margin-top:18px">
    <h2>🌐 ${TXT('신뢰 해사·항만 정보 소스 (외부 웹)','Trusted maritime & port sources (external)')}</h2>
    <p><span class="sec2">■ ${TXT('해상보안 속보','Maritime security alerts')}</span></p>${sec}
    <p style="margin-top:8px"><span class="gen2">■ ${TXT('항만 일반정보','General port information')}</span></p>${pi}
    <p style="color:var(--muted);font-size:11.5px">${TXT('※ 2026-07 웹 확인 기준 · ★권장 = 현재 조회 중인 국가/수역의 담당 보고기관','※ Verified on web 2026-07 · ★recommended = responsible reporting body for the country/area in view')}</p>
  </div>`;
}

Promise.all([
  fetch('ports-data.json?t='+Date.now()).then(r=>r.json()),
  fetch('translations-ko.json?t='+Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({})),
  fetch('translations-ko2.json?t='+Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({}))
]).then(([data, koMap, ko2])=>{
  KO = Object.assign({}, koMap||{}, ko2||{});
  let entries = data.ports;
  let title = '전체 항구 정보';
  if(wantPort){
    entries = entries.filter(p=>p.port===wantPort);
    title = wantPort + (entries[0]?` · ${entries[0].country}`:'');
  } else if(wantCountry){
    entries = entries.filter(p=>p.country===wantCountry);
    title = wantCountry + ' — 국가 전체';
  }
  document.getElementById('title').textContent = '⚓ ' + title;
  const g = entries.reduce((a,p)=>a+p.general,0), s = entries.reduce((a,p)=>a+p.security,0);
  document.getElementById('sub').textContent =
    `항목 ${g+s}건 · 인덱스 생성 ${ (data.generated||'').slice(0,10) } · 데이터 기간 2024.02 ~ 최신 · 번역 ${Object.keys(KO).length}건`;
  document.getElementById('stats').innerHTML =
    `<span class="stat">일반 <b class="g">${g}</b></span><span class="stat">보안 <b class="s">${s}</b></span><span class="stat">항구 ${entries.length}</span>`;
  let common = [];
  if(wantPort && entries.length){
    const cn = entries[0].country;
    common = data.ports.filter(p=>p.country===cn && p.isCountry && p.port!==wantPort);
  }
  window.__tmode = wantPort ? 'port' : (wantCountry ? 'country' : 'all');
  window.__meta = {g, s, generated:(data.generated||'').slice(0,10), ko:Object.keys(KO).length};
  window.__view = {title, entries, isCountry: !!wantCountry, common};
  renderAll();
}).catch(e=>{
  document.getElementById('main').innerHTML = '<div class="empty">데이터 로드 실패 — 인덱스가 아직 생성되지 않았을 수 있습니다.</div>';
  document.getElementById('sub').textContent = '';
});


/* ── 자동 브리핑: 선택된 항구/국가 정보를 한국어로 요약 설명 ── */
const SEC_THEMES = [
 [/kidnap|abduct/i,'납치'],[/piracy|pirate/i,'해적행위'],
 [/kinetic|projectile|uav|usv|drone.*attack|attack.*(uav|drone)|rpg|missile/i,'무력공격·드론/USV 위협'],
 [/stowaway/i,'밀항자'],[/drug|traffick|narco/i,'마약 밀수'],
 [/suspicious/i,'의심 선박 접근'],
 [/robber|theft|thief|stole|stolen|steal|intruder|boarded|boarding/i,'강도·절도(승선)'],
];
const GEN_THEMES = [
 [/ballast/i,'평형수(BWM) 규제'],[/biofoul|hull clean|craft risk/i,'선체부착생물(Biofouling) 규제'],
 [/stink bug|bmsb|moth|fsmc|snail|biosecurity|pest/i,'생물보안·검역 해충'],
 [/mpox|dengue|nipah|health|sanitation|sscc|mdh/i,'보건·위생 신고'],
 [/customs|fine|penalt|smuggl|declar/i,'세관·벌금 리스크'],
 [/draft|lock/i,'흘수·통항 조건'],[/mooring|rope|line/i,'계류(Mooring) 요건'],
 [/cctv/i,'CCTV 설치 요건'],[/shore power|emission|carb|opa/i,'배출·육상전원 규제'],
 [/pilot/i,'도선 안전'],[/anchor/i,'묘박 규정'],[/speed/i,'속력 제한'],
 [/salvage|vetting|checklist/i,'입항 전 심사·서식'],
 [/dgps|gnss|vhf|starlink/i,'항해·통신 장비 규정'],
 [/whale|jellyfish|fishery|strainer/i,'해양생물·조업 주의'],
 [/waste|garbage/i,'폐기물 처리 규제'],
];
const THEME_EN={'납치':'Kidnapping','해적행위':'Piracy','무력공격·드론/USV 위협':'Kinetic/UAV·USV threats','밀항자':'Stowaways','마약 밀수':'Drug smuggling','의심 선박 접근':'Suspicious approaches','강도·절도(승선)':'Robbery/theft (boarding)','평형수(BWM) 규제':'Ballast water (BWM)','선체부착생물(Biofouling) 규제':'Biofouling controls','생물보안·검역 해충':'Biosecurity/pests','보건·위생 신고':'Health/sanitation','세관·벌금 리스크':'Customs/fine risk','흘수·통항 조건':'Draft/transit limits','계류(Mooring) 요건':'Mooring requirements','CCTV 설치 요건':'CCTV requirement','배출·육상전원 규제':'Emissions/shore power','도선 안전':'Pilotage safety','묘박 규정':'Anchoring rules','속력 제한':'Speed limits','입항 전 심사·서식':'Pre-arrival checks/forms','항해·통신 장비 규정':'Nav/comms equipment','해양생물·조업 주의':'Marine life/fishing caution','폐기물 처리 규제':'Waste disposal rules'};
function themeCount(items, cat, themes){
  const hits = {};
  items.filter(i=>i.cat===cat).forEach(i=>{
    for(const [re,name] of themes){ if(re.test(i.text)){ hits[name]=(hits[name]||0)+1; break; } }
  });
  return Object.entries(hits).sort((a,b)=>b[1]-a[1]);
}
function makeBrief(title, entries, isCountry){
  const all = entries.flatMap(p=>p.items);
  const g = all.filter(i=>i.cat==='general').length, sN = all.filter(i=>i.cat==='security').length;
  const yms = all.map(i=>i.ym).sort();
  const first = yms[0]||'', last = yms[yms.length-1]||'';
  let out = '';

  out += TXT(
    `<p><b>${title}</b>에 대해 <span class="hl">${first} ~ ${last}</span> 기간 총 <span class="hl">${all.length}건</span>의 항만 정보가 축적되어 있습니다 — <span class="gen2">일반(규제·운항) ${g}건</span>, <span class="sec2">보안(사고·위협) ${sN}건</span>.</p>`,
    `<p><b>${title}</b>: <span class="hl">${all.length} items</span> accumulated over <span class="hl">${first} – ${last}</span> — <span class="gen2">${g} general (regulation/operations)</span>, <span class="sec2">${sN} security (incidents/threats)</span>.</p>`);

  if(isCountry && entries.length>1){
    const top = entries.slice().sort((a,b)=>b.items.length-a.items.length).slice(0,4)
      .map(p=>`${p.port}(${p.items.length})`).join(', ');
    out += TXT(`<p>국가 내 정보가 집중된 항구: <span class="hl">${top}</span>${entries.length>4?` 외 ${entries.length-4}곳`:''}.</p>`,
               `<p>Ports with most information: <span class="hl">${top}</span>${entries.length>4?` and ${entries.length-4} more`:''}.</p>`);
  }

  const st = themeCount(all,'security',SEC_THEMES);
  if(st.length){
    out += `<p><span class="sec2">■ ${TXT('보안 위협 유형','Security threat types')}</span> — ${st.map(([n,c])=>`${TXT(n,THEME_EN[n]||n)} ${TXT(c+'건','×'+c)}`).join(' · ')}. `;
    if(st.some(([n])=>n.includes('강도'))) out += TXT(`정박지/협수로 통항 중 승선 절도가 반복되는 패턴이므로 앵커체인·선미 감시, 조명·순찰 강화, 창고 시정 관리가 요구됩니다.`,`Boarding theft recurs at anchorages/narrow passages — reinforce anchor-chain and stern watch, lighting and patrols, and keep stores locked.`);
    if(st.some(([n])=>n.includes('무력'))) out += TXT(` 무력공격 위협이 보고된 수역으로, 최신 보안정보 확인과 통항 전 위험성 평가가 필요합니다.`,` Kinetic-attack threats reported in this area — check the latest security information and complete a pre-transit risk assessment.`);
    if(st.some(([n])=>n.includes('납치')||n.includes('해적'))) out += TXT(` 납치/해적 이력이 있어 시타델 절차와 BMP 준수가 중요합니다.`,` Kidnapping/piracy history — citadel procedures and BMP compliance are essential.`);
    out += `</p>`;
  }
  const gt = themeCount(all,'general',GEN_THEMES);
  if(gt.length){
    out += `<p><span class="gen2">■ ${TXT('규제·운항 특징','Regulatory & operational features')}</span> — ${gt.map(([n,c])=>`${TXT(n,THEME_EN[n]||n)} ${TXT(c+'건','×'+c)}`).join(' · ')}. ${TXT('입항 전 해당 요건의 최신 원문(PDF 링크)을 확인하고 선내 준비상태를 점검하십시오.','Before arrival, review the latest source documents (PDF links) and verify onboard readiness.')}</p>`;
  }
  const recent = all.slice().sort((a,b)=>b.ym.localeCompare(a.ym)).slice(0,3);
  if(recent.length){
    out += `<p><span class="hl">■ ${TXT('최신 동향','Latest updates')}</span></p>`;
    recent.forEach(r=>{
      const body = LANG==='ko' ? (koOf(r.text) || r.text) : r.text;
      out += `<p style="margin-left:10px">· <span class="hl">${r.ym}</span> ${body}</p>`;
    });
  }
  out += `<p style="color:var(--muted);font-size:12px">${TXT('※ 본 요약은 인덱싱된 항목을 기반으로 자동 생성된 참고 정보이며, 세부 내용은 아래 항목별 원문을 확인하십시오.','※ This summary is auto-generated from indexed items for reference; see the per-item sources below for details.')}</p>`;
  return out;
}

/* ── 다운로드 기능: 현재 화면(필터 적용된) 정보 그대로 저장 ── */
function _rows(){
  const rows = [];
  visibleEntries().concat(visibleCommon()).forEach(p => p.items.forEach(i => rows.push({
    port: p.port, country: p.country, ym: i.ym,
    cat: i.cat==='security' ? 'Security' : 'General',
    text: i.text, src: i.src, link: i.link
  })));
  return rows;
}
function _save(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 500);
}
function _fname(ext){
  const t = (window.__view && window.__view.title || 'PortInfo').replace(/[^\w가-힣]+/g,'_');
  return `PortInfo_${t}_${new Date().toISOString().slice(0,10)}.${ext}`;
}
function dlCSV(){
  const esc = s => '"' + String(s??'').replace(/"/g,'""') + '"';
  const head = 'Port,Country,Year-Month,Category,Description_KO,Description_EN,Source File,Source Link';
  const lines = _rows().map(r => [r.port,r.country,r.ym,r.cat,(koOf(r.text)||''),r.text,r.src,r.link].map(esc).join(','));
  _save(new Blob(['\ufeff'+head+'\n'+lines.join('\n')], {type:'text/csv;charset=utf-8'}), _fname('csv'));
}
function dlDOC(){
  const v = window.__view;
  const rows = _rows().map(r => `<tr>
    <td>${r.port}</td><td>${r.country}</td><td>${r.ym}</td>
    <td style="color:${r.cat==='Security'?'#c0392b':'#2471a3'};font-weight:bold">${r.cat}</td>
    <td>${LANG==='ko'?(koOf(r.text)||r.text):r.text}</td><td><a href="${r.link}">${r.src}</a></td></tr>`).join('');
  const html = `<html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8">
    <style>body{font-family:'Malgun Gothic',Calibri,sans-serif;font-size:10.5pt}
    h1{font-size:15pt;color:#1a3c5e} .meta{color:#666;font-size:9pt;margin-bottom:12pt}
    table{border-collapse:collapse;width:100%} td,th{border:1px solid #999;padding:4pt 6pt;vertical-align:top;font-size:9.5pt}
    th{background:#1a3c5e;color:#fff}</style></head><body>
    <h1>⚓ WSMK Port Information — ${v.title}</h1>
    <div style="background:#f4f7fa;border-left:4px solid #1a3c5e;padding:8pt 10pt;margin:8pt 0;font-size:9.5pt">${(window.__brief||'').replace(/class="[^"]*"/g,'')}</div>
    <div class="meta">Generated ${new Date().toLocaleString('ko-KR')} · Source: WSMK Work Place / Port Information</div>
    <table><tr><th>Port</th><th>Country</th><th>Y-M</th><th>Cat.</th><th>Description</th><th>Source</th></tr>${rows}</table>
    </body></html>`;
  _save(new Blob([html], {type:'application/msword'}), _fname('doc'));
}
</script>
