<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WSMK Port Information</title>
<style>
  :root{--bg:#0D1522;--panel:#131F30;--line:#22334A;--text:#DCE6F2;--muted:#8CA0B8;
        --accent:#5AB8D6;--gen:#5AB8D6;--sec:#E0703C;
        --mono:'IBM Plex Mono',ui-monospace,monospace}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,'Malgun Gothic',sans-serif;font-size:14px}
  header{padding:14px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:9}
  header h1{font-size:19px}
  header .sub{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:4px}
  .stats{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
  .stat{padding:3px 10px;border:1px solid var(--line);border-radius:4px;font-family:var(--mono);font-size:12px;background:var(--bg)}
  .stat b.g{color:var(--gen)} .stat b.s{color:var(--sec)}
  main{max-width:860px;margin:0 auto;padding:14px}
  .portsec{margin:16px 0 6px;font-size:15px;font-weight:700;color:var(--accent)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:11px 13px;margin:8px 0}
  .card .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  .badge{padding:1px 8px;border-radius:3px;font-size:10.5px;font-family:var(--mono);font-weight:700;color:#08121F}
  .badge.g{background:var(--gen)} .badge.s{background:var(--sec)}
  .ym{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .txt{line-height:1.55}
  .src{margin-top:7px;font-size:11.5px}
  .src a{color:var(--accent);text-decoration:none}
  .src a:hover{text-decoration:underline}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .note{font-size:11px;color:var(--muted);padding:10px 18px;border-top:1px solid var(--line);margin-top:20px}
</style>
</head>
<body>
<header>
  <h1 id="title">Port Information</h1>
  <div class="sub" id="sub">로딩 중…</div>
  <div class="stats" id="stats"></div>
</header>
<main id="main"></main>
<div class="note">출처: WSMK Work Place / Port Information (월간 Port Information Update 등) · 원문 PDF는 각 항목의 링크로 열람 · 자동 인덱싱</div>
<script>
const q = new URLSearchParams(location.search);
const wantPort = q.get('port'), wantCountry = q.get('country');

fetch('ports-data.json?t='+Date.now()).then(r=>r.json()).then(data=>{
  let entries = data.ports;
  let title = '전체 항구 정보';
  if(wantPort){
    entries = entries.filter(p=>p.port===wantPort);
    title = wantPort + (entries[0]?` · ${entries[0].country}`:'');
  } else if(wantCountry){
    entries = entries.filter(p=>p.country===wantCountry);
    title = wantCountry + ' — 국가 전체';
  }
  document.getElementById('title').textContent = '⚓ ' + title;
  const g = entries.reduce((a,p)=>a+p.general,0), s = entries.reduce((a,p)=>a+p.security,0);
  document.getElementById('sub').textContent =
    `항목 ${g+s}건 · 인덱스 생성 ${ (data.generated||'').slice(0,10) } · 데이터 기간 2024.02 ~ 최신`;
  document.getElementById('stats').innerHTML =
    `<span class="stat">일반 <b class="g">${g}</b></span><span class="stat">보안 <b class="s">${s}</b></span><span class="stat">항구 ${entries.length}</span>`;

  const main = document.getElementById('main');
  if(!entries.length){ main.innerHTML = '<div class="empty">해당하는 정보가 없습니다.</div>'; return; }

  main.innerHTML = entries.map(p=>{
    const items = p.items.map(i=>`
      <div class="card">
        <div class="top"><span class="badge ${i.cat==='security'?'s':'g'}">${i.cat==='security'?'SECURITY':'GENERAL'}</span><span class="ym">${i.ym}</span></div>
        <div class="txt">${i.text}</div>
        <div class="src">📄 <a href="${i.link}" target="_blank" rel="noopener">${i.src||'원문 PDF'}</a></div>
      </div>`).join('');
    const head = (wantPort && entries.length===1) ? '' :
      `<div class="portsec">⚓ ${p.port} <span class="ym">(${p.country} · ${p.items.length}건)</span></div>`;
    return head + items;
  }).join('');
}).catch(e=>{
  document.getElementById('main').innerHTML = '<div class="empty">데이터 로드 실패 — 인덱스가 아직 생성되지 않았을 수 있습니다.</div>';
  document.getElementById('sub').textContent = '';
});
</script>
</body>
</html>
