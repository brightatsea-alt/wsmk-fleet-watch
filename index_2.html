<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WSMK Fleet Watch</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D1522; --panel:#131F30; --panel2:#0F1928; --line:#22334A;
    --text:#DCE6F2; --muted:#8CA0B8; --accent:#5AB8D6;
    --live:#3DDC97; --dr:#F0B95A; --stale:#E0703C; --nosig:#6E7E92;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --cond:'Barlow Condensed',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:14px;overflow:hidden}

  /* ── Top status board ── */
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{font-family:var(--cond);font-weight:600;font-size:22px;letter-spacing:.06em;color:#fff}
  .brand small{color:var(--accent);font-size:13px;letter-spacing:.18em;margin-left:8px}
  .board{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
  .chip{display:flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel2);font-family:var(--mono);font-size:12px;cursor:pointer;user-select:none}
  .chip.on{border-color:var(--accent)}
  .dot{width:8px;height:8px;border-radius:50%}
  .updated{font-family:var(--mono);font-size:11px;color:var(--muted);width:100%;text-align:right}
  @media(min-width:900px){.updated{width:auto}}

  /* ── Layout ── */
  #wrap{display:flex;height:calc(100% - 57px)}
  aside{width:330px;min-width:330px;background:var(--panel2);border-right:1px solid var(--line);display:flex;flex-direction:column}
  #map{flex:1}
  .search{padding:10px;border-bottom:1px solid var(--line)}
  .search input{width:100%;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--text);font-size:13px;outline:none}
  .search input:focus{border-color:var(--accent)}
  #list{flex:1;overflow-y:auto}
  .sec{padding:7px 12px;font-family:var(--cond);font-size:14px;letter-spacing:.12em;color:var(--muted);background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid rgba(34,51,74,.5);cursor:pointer}
  .row:hover{background:rgba(90,184,214,.07)}
  .row .st{width:9px;height:9px;border-radius:50%;flex:none}
  .row .nm{flex:1;min-width:0}
  .row .nm b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .nm span{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .row .lt{font-family:var(--mono);font-size:11px;text-align:right;color:var(--muted);flex:none;line-height:1.5}
  .row .lt b{display:block;color:var(--text);font-weight:500;font-size:12px}
  .row.dim{opacity:.75}
  #fbar{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
  #fbar select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:4px 6px;font-size:11.5px;font-family:var(--mono);outline:none;min-width:0}
  #fbar select:focus{border-color:var(--accent)}
  #fbar select.act{border-color:var(--accent);color:var(--accent)}
  #fbar .fx{display:flex;align-items:center;justify-content:flex-end;gap:6px}
  #fbar #fcnt{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  #fbar #fclr{background:none;border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:3px 8px;font-size:10.5px;cursor:pointer}
  #fbar #fclr:hover{border-color:var(--accent);color:var(--accent)}
  .row.sel{background:rgba(90,184,214,.16);box-shadow:inset 3px 0 0 var(--accent)}
  .brand{cursor:pointer}
  #posbox{position:absolute;top:12px;right:12px;z-index:850;width:290px;background:rgba(13,21,34,.96);
    border:1px solid var(--line);border-radius:8px;padding:11px 12px;box-shadow:0 6px 24px rgba(0,0,0,.55);display:none}
  #posbox.on{display:block}
  #posbox h4{font-size:12px;color:var(--accent);margin-bottom:6px;letter-spacing:.05em}
  #posbox textarea{width:100%;height:64px;resize:vertical;background:var(--panel);border:1px solid var(--line);
    border-radius:5px;color:var(--text);font-family:var(--mono);font-size:12px;padding:6px 8px;outline:none}
  #posbox textarea:focus{border-color:var(--accent)}
  #posbox .ex{font-family:var(--mono);font-size:10px;color:var(--muted);margin:6px 0 8px;line-height:1.6}
  #posbox .bt{display:flex;gap:6px}
  #posbox button{flex:1;padding:6px 0;border:1px solid var(--line);border-radius:5px;background:#1a6fb5;color:#fff;
    font-size:12px;font-weight:600;cursor:pointer}
  #posbox button.alt{background:var(--panel);color:var(--muted)}
  #posbox .msg{font-family:var(--mono);font-size:10.5px;margin-top:7px;min-height:13px;color:var(--muted)}
  .wplbl{background:rgba(24,14,40,.94);border:1px solid rgba(201,167,255,.7);color:#E6D8FF;font-family:var(--mono);
    font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:3px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.5)}
  .wplbl::before{display:none}
  @media(max-width:760px){#posbox{width:auto;left:10px;right:10px}}
  @keyframes dpulse{0%{transform:scale(.75);opacity:.85}70%{transform:scale(1.35);opacity:0}100%{opacity:0}}
  .destmk .ring{transform-origin:center;animation:dpulse 2.2s ease-out infinite}
  .destlbl{background:rgba(24,18,8,.92);border:1px solid rgba(240,185,90,.65);color:#F7D79A;
    font-family:var(--mono);font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:3px;
    box-shadow:0 2px 8px rgba(0,0,0,.55);white-space:nowrap}
  .destlbl::before{display:none}
  #legend{display:none!important}
  #trkpanel{display:none;position:fixed;left:344px;bottom:34px;z-index:900;width:330px;background:rgba(13,21,34,.94);
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:11px;color:var(--text);
    box-shadow:0 6px 20px rgba(0,0,0,.5);backdrop-filter:blur(4px)}
  #trkpanel .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  #trkpanel .hd b{font-size:12.5px;color:#fff;font-family:-apple-system,'Malgun Gothic',sans-serif}
  #trkpanel .x{cursor:pointer;color:var(--muted);padding:0 4px}
  #trkpanel .x:hover{color:#fff}
  #trkinfo{color:var(--muted);margin-bottom:7px;line-height:1.5}
  #trkinfo b{color:#F0B95A}
  #trkpanel input[type=range]{width:100%;margin:2px 0;accent-color:#F0B95A}
  #trkcalls{margin-top:8px;border-top:1px solid var(--line);padding-top:7px;max-height:190px;overflow-y:auto}
  #trkcalls .hh{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);margin-bottom:4px}
  #trkcalls .cl{display:flex;gap:7px;align-items:flex-start;padding:4px 0;border-bottom:1px solid rgba(34,51,74,.5);font-size:11.5px}
  #trkcalls .cl:last-child{border-bottom:none}
  #trkcalls .ic{flex:none;width:14px;text-align:center}
  #trkcalls .pn{font-weight:600;color:var(--text)}
  #trkcalls .tm{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  #trkcalls .anch .pn{color:#F0B95A}
  #trkpanel .rl{color:#6E7E92;font-size:9.5px;letter-spacing:.08em}
  @media(max-width:760px){#trkpanel{left:8px;right:8px;width:auto}}
  #coord{position:fixed;left:0;right:0;bottom:0;z-index:900;height:26px;display:flex;align-items:center;gap:16px;
    padding:0 14px;background:rgba(11,18,29,.94);border-top:1px solid var(--line);font-family:var(--mono);
    font-size:11.5px;color:var(--muted);letter-spacing:.03em;pointer-events:none;backdrop-filter:blur(4px);white-space:nowrap;overflow:hidden}
  #coord b{color:var(--accent);font-weight:600}
  #coord .dd{color:#6E7E92}
  #coord .lbl{color:#6E7E92;font-size:10px;letter-spacing:.12em}
  #wrap{height:calc(100% - 83px)}
  .leaflet-control-attribution{margin-bottom:26px!important}
  .leaflet-bottom{margin-bottom:26px}
  @media(max-width:760px){#coord{display:none} #wrap{height:calc(100% - 57px)}}
  .leaflet-control-attribution{background:rgba(13,21,34,.72)!important;color:#8CA0B8!important;font-size:9.5px}
  .leaflet-control-attribution a{color:#5AB8D6!important}
  .leaflet-control-scale-line{background:rgba(13,21,34,.72);border-color:rgba(140,160,184,.6);color:#DCE6F2;font-family:var(--mono);font-size:10px}
  .leaflet-bar a{background:#131F30;color:#DCE6F2;border-color:#22334A}
  .leaflet-bar a:hover{background:#1B2B41;color:#fff}
  #mapstyle{border-color:rgba(90,184,214,.5)}
  #portsel{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-family:var(--mono);font-size:12px;outline:none;max-width:240px}
  #langbtn{border-color:var(--accent);color:var(--accent);font-weight:700;background:rgba(90,184,214,.14);box-shadow:inset 0 0 0 1px rgba(90,184,214,.3)}
  #langbtn:hover{background:var(--accent);color:#08121F}
  body.lightmap .plabel{background:rgba(255,255,255,.92);color:#12263A;border-color:rgba(20,60,90,.35)}
  body.lightmap .plabel.sec{background:rgba(255,241,233,.95);color:#8A3A12;border-color:rgba(200,90,46,.5)}
  body.lightmap .vlabel{background:rgba(255,255,255,.95);color:#10203A;border-color:rgba(20,60,90,.3)}
  #tghint{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
  @media(max-width:760px){#tghint{display:none}}
  .sec .lth{float:right;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:#6E7E92}

  /* ── Map markers ── */
  .vmark{filter:drop-shadow(0 0 3px rgba(0,0,0,.7))}
  .leaflet-popup-content-wrapper{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;font-size:12.5px}
  .leaflet-popup-tip{background:var(--panel)}
  .pop b.t{font-size:14px;display:block;margin-bottom:5px}
  .pop table{font-family:var(--mono);font-size:11.5px;border-collapse:collapse}
  .pop td{padding:1.5px 0}
  .pop td:first-child{color:var(--muted);padding-right:12px}
  .pop .pch{margin-top:7px;padding-top:6px;border-top:1px solid var(--line);font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--muted)}
  .pop .pcl{margin-top:3px;font-size:11.5px;max-height:96px;overflow-y:auto}
  .pop .pcr{padding:2px 0;white-space:nowrap}
  .pop .pcr b{color:#F0B95A;font-weight:600}
  .pop .pcr span{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:4px}
  .pop .pcn{color:var(--muted);font-size:10.5px}
  .badge{display:inline-block;padding:1px 7px;border-radius:3px;font-size:10.5px;font-family:var(--mono);color:#08121F;font-weight:600;margin-left:6px;vertical-align:1px}

  /* ── Mobile ── */
  #toggle{display:none}
  @media(max-width:760px){
    aside{position:absolute;z-index:1000;height:calc(100% - 57px);width:min(330px,86vw);transform:translateX(-100%);transition:transform .22s}
    aside.open{transform:none}
    #toggle{display:block;position:absolute;z-index:1002;z-index:1001;bottom:18px;left:14px;padding:10px 16px;background:var(--accent);color:#08121F;border:none;border-radius:24px;font-weight:700;font-size:13px;box-shadow:0 3px 10px rgba(0,0,0,.5)}
  }
  #list::-webkit-scrollbar{width:8px}#list::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

  /* ── Port layer ── */
  .plabel{background:rgba(9,16,27,.82);border:1px solid rgba(90,184,214,.35);color:#CFE0EE;
    font-size:10px;font-family:var(--mono);letter-spacing:.02em;padding:1px 6px;border-radius:3px;
    box-shadow:0 1px 4px rgba(0,0,0,.5);white-space:nowrap}
  .plabel::before{display:none}
  .leaflet-tooltip.plabel{display:none;width:auto!important;max-width:200px;overflow:hidden;text-overflow:ellipsis}
  .zl4 .leaflet-tooltip.plabel.major{display:block}
  .zl5 .leaflet-tooltip.plabel{display:block}
  .leaflet-tooltip.plabel.hov{display:block;z-index:900}
  .plabel.sec{border-color:rgba(224,112,60,.55);color:#F0C4AE}
  .vlabel{background:rgba(9,16,27,.9);border:1px solid rgba(255,255,255,.18);color:#fff;
    font-size:11px;font-weight:600;padding:2px 7px;border-radius:3px;box-shadow:0 1px 5px rgba(0,0,0,.6)}
  .vlabel::before{display:none}
  .leaflet-tooltip.vlabel{display:block;font-size:10.5px;padding:1px 6px;opacity:.95}
  .zl3 .leaflet-tooltip.vlabel{display:block}
  .leaflet-tooltip.vlabel.hov{display:block;z-index:950;font-weight:700}
  /* ── Legend ── */
  #legend{position:absolute;left:14px;bottom:14px;z-index:800;background:rgba(13,21,34,.88);
    border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-family:var(--mono);
    font-size:10.5px;color:var(--muted);backdrop-filter:blur(3px);line-height:1.75;pointer-events:none}
  #legend b{color:var(--text);font-weight:600;display:block;margin-bottom:3px;letter-spacing:.08em;font-size:10px}
  #legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}
  #legend .sep{height:1px;background:var(--line);margin:6px 0}
  @media(max-width:760px){#legend{display:none}}
  .pbtn{display:block;width:100%;margin-top:5px;padding:7px 10px;border:none;border-radius:5px;
    background:#1a6fb5;color:#fff;font-size:12.5px;cursor:pointer;font-weight:600}
  .pbtn.co{background:#57606e}
  .pbtn:hover{filter:brightness(1.15)}
</style>
</head>
<body>
<header>
  <div class="brand" onclick="location.reload()" title="새로고침">FLEET WATCH<small>WSM KOREA</small></div>
  <div class="chip" id="langbtn" onclick="toggleLang()" style="cursor:pointer">🌐 English</div>
  <div class="board" id="board"></div>
  <div class="chip" id="health" title="\uB370\uC774\uD130 \uC218\uC9D1 \uC0C1\uD0DC"><span class="dot" style="background:#6E7E92"></span>\uD655\uC778 \uC911</div>
  <div class="updated" id="updated">데이터 로딩 중…</div>
</header>
<div id="wrap">
  <aside id="side" class="open">
    <div class="search"><input id="q" type="search" placeholder="선박명 · MMSI 검색"></div>
    <div id="fbar">
      <select id="fteam"><option value="">Team 전체</option></select>
      <select id="fvm"><option value="">Vessel Manager 전체</option></select>
      <select id="fhseq"><option value="">HSEQ 전체</option></select>
      <div class="fx"><span id="fcnt"></span><button id="fclr">초기화</button></div>
    </div>
    <div id="list"></div>
  </aside>
  <div id="map"></div>
</div>
<button id="toggle">선박 목록</button>
<div id="trkpanel">
  <div class="hd"><b id="trkname">—</b><span class="x" onclick="closeTrack()">✕</span></div>
  <div id="trkinfo">—</div>
  <div class="rl">시작 START</div><input type="range" id="trkfrom" min="0" max="1" value="0" oninput="drawTrack()">
  <div class="rl">종료 END</div><input type="range" id="trkto" min="0" max="1" value="1" oninput="drawTrack()">
  <div id="trkcalls"></div>
</div>
<div id="posbox">
  <h4>📍 위경도 입력</h4>
  <textarea id="posin" placeholder="예) 23-40N 123-40E &#10;35°06.5′N 129°02.4′E &#10;35.0994, 129.0403"></textarea>
  <div class="ex">여러 줄을 한거번에 붙여넣을 수 있습니다<br>도-분 / 십진도 / DDMM 형식 모두 인식</div>
  <div class="bt"><button id="posgo">표시</button><button id="posclr" class="alt">지우기</button><button id="posx" class="alt">닫기</button></div>
  <div class="msg" id="posmsg"></div>
</div>
<div id="coord"><span class="lbl">CURSOR</span><span id="cpos">—</span><span class="lbl" id="bld" style="margin-left:auto"></span></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* 선대 명부 내장 — 데이터 파일을 못 읽어도 56척 전원 항상 표시 */

{no:54,name:"Oriental Leader",mmsi:"441903000"},{no:55,name:"Royal Tern",mmsi:null}
];

const ST = {
  LIVE :{label:'실측',      color:'var(--live)',  hex:'#3DDC97'},
  DR   :{label:'추정(DR)',  color:'var(--dr)',    hex:'#F0B95A'},
  STALE:{label:'장기 미수신',color:'var(--stale)', hex:'#E0703C'},
  NOSIG:{label:'대기 · AIS 미수신', color:'var(--nosig)', hex:'#6E7E92'},

  return ds + '\u00B0 ' + m.toFixed(3).padStart(6,'0') + "' " + hemi;
}

 {id:'osm',name:'표준',max:18,attr:'OpenStreetMap',dark:false,

const R2D=180/Math.PI, D2R=Math.PI/180;

/* Dead reckoning: project last position along COG at SOG for elapsed hours */
function project(lat,lon,cog,nm){
  const dLat = nm*Math.cos(cog*D2R)/60;
  const dLon = nm*Math.sin(cog*D2R)/(60*Math.cos(lat*D2R)||1e-6);
  let nlon=lon+dLon; if(nlon>180)nlon-=360; if(nlon<-180)nlon+=360;
  return [Math.max(-85,Math.min(85,lat+dLat)), nlon];
}
function tzOf(lon){ return Math.round(lon/15); }
function localTime(lon){
  const tz=tzOf(lon), d=new Date(Date.now()+tz*3600e3);
  return {hm:String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0'),
          tz:'UTC'+(tz>=0?'+':'')+tz};
}
function ago(h){ if(!isFinite(h)) return '\u2014'; return h<1 ? Math.round(h*60)+'분 전' : h<48 ? h.toFixed(1)+'h 전' : Math.floor(h/24)+'일 전'; }
function fmtEta(e){ return e&&e.Month ? String(e.Month).padStart(2,'0')+'/'+String(e.Day).padStart(2,'0')+' '+String(e.Hour).padStart(2,'0')+':'+String(e.Minute||0).padStart(2,'0'):null; }

/* Merge registry + AIS store → display model. Every vessel in fleet.json ALWAYS appears. */
function build(){
  const now=Date.now();
  vessels = fleet.map(f=>{
    var d = f.mmsi ? (store.vessels[f.mmsi]||null) : null;
    if(!d){ var nk=String(f.name||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/MORNINGLUNA|[()]/g,'');
      for(var sk in store.vessels){ var sv=store.vessels[sk];
        var sn=String(sv.name||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
        if(sn && nk && (sn===nk || nk.indexOf(sn)>=0 || sn.indexOf(nk)>=0)){ d=sv; break; } } }
    const v = {...f, data:d};
    if(!f.mmsi){ v.status='NOSIG'; v.note='MMSI 미등록'; return v; }
    if(!d || d.lat==null){ v.status='NOSIG'; v.note='수신 이력 없음'; return v; }
    const h=(now-new Date(d.lastReceived).getTime())/3600e3;
    v.elapsed=h;
    v.status = h<6 ? 'LIVE' : h<24 ? 'DR' : 'STALE';
    const moving = (d.sog||0)>=0.5 && d.navStatus!==1 && d.navStatus!==5 && d.cog!=null && d.cog<360;
    v.anchored=!moving;
    if(moving && h>0.02){
      const nm=Math.min(d.sog*h, d.sog*72);           // 3일 이상은 투영 중단
      [v.lat,v.lon]=project(d.lat,d.lon,d.cog,nm);
      v.estimated=h>=0.5;
      v.radiusNm=Math.min(Math.max(3,h*3),180);       // 불확실성 반경
    } else { v.lat=d.lat; v.lon=d.lon; }
    return v;
  });
}

function shipIcon(v){
  const c=ST[v.status].hex;
  const ring = v.status==='LIVE' ? `<circle cx="11" cy="11" r="9.5" fill="none" stroke="${c}" stroke-width="1" opacity=".35"/>` : '';
  const svg = v.anchored||v.data.cog==null||v.data.cog>=360
    ? `<svg class="vmark" width="22" height="22" viewBox="0 0 22 22">${ring}<circle cx="11" cy="11" r="5" fill="${c}" stroke="#06101C" stroke-width="1.6"/></svg>`
    : `<svg class="vmark" width="22" height="22" viewBox="0 0 22 22" style="transform:rotate(${v.data.cog}deg)">${ring}<path d="M11 2.5 L16.4 18 L11 14.4 L5.6 18 Z" fill="${c}" stroke="#06101C" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
  return L.divIcon({html:svg,className:'',iconSize:[22,22],iconAnchor:[11,11]});
}

function popup(v){
  const d=v.data, lt=localTime(v.lon);
  const rows=[
    ['상태', ST[v.status].label + (v.anchored?' · 정박/묘박':'') + (v.estimated?' · 위치는 DR 추정':'')],
    ['현지시간', `${lt.hm} (${lt.tz})`],
    ['위치', v.lat.toFixed(3)+'°, '+v.lon.toFixed(3)+'°'],
    ['SOG / COG', (d.sog!=null?d.sog.toFixed(1)+' kn':'—')+' / '+(d.cog!=null&&d.cog<360?Math.round(d.cog)+'°':'—')],
    ['최종 AIS', ago(v.elapsed)],
    ['목적지', d.destination ? (destFull(d.destination) + (d.destAt ? ' <span style="color:var(--muted);font-size:10px">('+ago((Date.now()-new Date(d.destAt).getTime())/3600e3)+' 수신)</span>' : '')) : '<span style="color:var(--muted)">— AIS 정적정보 미수신</span>'],
    fmtEta(d.eta)?['ETA', fmtEta(d.eta)+' UTC']:null,
    ['MMSI', v.mmsi],
    ['데이터', (d.source||'').indexOf('polestar')===0 ? '위성 AIS · Pole Star' : '지상 AIS'],
  ].filter(Boolean);
  return `<div class="pop"><b class="t">${v.name}<span class="badge" style="background:${ST[v.status].hex}">${ST[v.status].label}</span></b>
    <table>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>
    <button class="pbtn" style="background:#8A6A22" onclick="showTrack('${(d.mmsi||d.imo||v.mmsi||'')}','${v.name.replace(/'/g,"")}')">\uD83D\uDCC8 \uD56D\uC801 Track \uBCF4\uAE30 \u2192</button>
    <div class="pch">\uCD5C\uADFC \uAE30\uD56D</div><div class="pcl" id="pc_${v.no}">\uBD88\uB7EC\uC624\uB294 \uC911\u2026</div>
    ${(function(){ try{ var pe=d.destination?destPortEntry(d.destination):null; if(!pe) return '';
      return pe.countryOnly
        ? `<button class="pbtn co" onclick="openCountry('${enc(pe.country)}')">\uD83C\uDF0F ${pe.country} \uD56D\uB9CC \uC815\uBCF4 \uBCF4\uAE30 \u2192</button>`
        : `<button class="pbtn" onclick="openPort('${enc(pe.port)}')">\u2693 ${pe.port} \uD56D\uAD6C \uC815\uBCF4 \uBCF4\uAE30 \u2192</button>`;
    }catch(e){ return ''; } })()}
    ${v.estimated?'<div style="margin-top:5px;color:var(--muted);font-size:10.5px">⚠ 추정 위치 — 운영 참고용 (PSC·사고조사 등 공식 용도 사용 불가)</div>':''}</div>`;
}

function render(){
  build();
  layer.clearLayers(); markers={};
  if(shipsOn) vessels.forEach(v=>{
   try{
    if(v.lat==null) return;
    if(soloNo!=null && v.no!==soloNo) return;
    if(soloNo==null && !passResp(v)) return;      // 필터에 맞는 선박만 지도 표시      // 단일 보기
    if((v.estimated||v.status==='STALE') && v.radiusNm>0){   // 반경 NaN 시 Leaflet 예외 방지
      L.circle([v.lat,v.lon],{radius:v.radiusNm*1852,color:ST[v.status].hex,weight:1,dashArray:'4 5',fillOpacity:.05,pane:'portsPane',interactive:false}).addTo(layer);
    }
    markers[v.no]=L.marker([v.lat,v.lon],{icon:shipIcon(v),pane:'shipsPane',riseOnHover:true})
      .bindTooltip(v.name,{permanent:true,direction:'top',offset:[0,-12],className:'vlabel',opacity:1})
      .bindPopup(function(){ try{ return popup(v); }catch(e){ return '<div class="pop"><b class="t">'+v.name+'</b></div>'; } }(),{autoPan:false})
      .on('popupopen', function(){ try{ loadCalls(v); }catch(e){} })
      .on('mouseover', function(){ try{ var t=this.getTooltip(), el=t&&t.getElement(); if(el) el.classList.add('hov'); }catch(e){} })
      .on('mouseout', function(){ try{ var t=this.getTooltip(), el=t&&t.getElement(); if(el) el.classList.remove('hov'); }catch(e){} })
      .addTo(layer);
   }catch(e){}
  });
  try{
    if(soloNo!=null){ var sv=vessels.filter(function(x){return x.no===soloNo;})[0]; drawDest(sv); }
    else if(destLayer) destLayer.clearLayers();
  }catch(e){}
  try{ applyPortLabels(); }catch(e){}
  renderBoard(); renderList();
}

function renderBoard(){
  const c={LIVE:0,DR:0,STALE:0,NOSIG:0};
  vessels.forEach(v=>c[v.status]++);
  document.getElementById('board').innerHTML =
    Object.keys(ST).map(k=>`<div class="chip ${filter===k?'on':''}" onclick="setFilter('${k}')">
      <span class="dot" style="background:${ST[k].hex}"></span>${ST[k].label} <b>${c[k]}</b></div>`).join('')
    + `<div class="chip ${filter===null?'on':''}" onclick="setFilter(null)">전체 <b>${vessels.length}</b></div>`;
}
function setFilter(k){ filter=k; soloNo=null; render(); }

function renderList(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  var gv=function(id){ var s=document.getElementById(id); return s?s.value:''; };
  var ft=gv('fteam'), fv=gv('fvm'), fh=gv('fhseq');
  var rOf=function(v){ return RESP[v.mmsi||''] || RESP[v.name] || null; };
  const show=vessels.filter(function(v){
    if(filter && v.status!==filter) return false;
    if(q && !(v.name.toLowerCase().includes(q)||(v.mmsi||'').includes(q))) return false;
    if(!passResp(v)) return false;
    return true;
  });
  try{ var fcx=document.getElementById('fcnt'); if(fcx) fcx.textContent=(ft||fv||fh)? show.length+'척' : ''; }catch(e){}
  const byName=(a,b)=>a.name.localeCompare(b.name,'en');
  const onMap=show.filter(v=>v.lat!=null).sort(byName), standby=show.filter(v=>v.lat==null).sort(byName);
  const row=v=>{
    const lt=v.lon!=null?localTime(v.lon):null;
    const sub=v.status==='NOSIG'?v.note:`${v.data.sog!=null?v.data.sog.toFixed(1)+' kn · ':''}${ago(v.elapsed)}`;
    return `<div class="row ${v.status==='NOSIG'?'dim':''}${soloNo===v.no?' sel':''}" onclick="focusV(${v.no})" title="${v.name}${lt?' · 현지시간 '+lt.hm+' '+lt.tz:''}">
      <span class="st" style="background:${ST[v.status].hex}"></span>
      <div class="nm"><b>${v.name}</b><span>${(function(){var r=RESP[v.mmsi||'']||RESP[v.name]; return r? r.team+' · '+r.vm+' · '+r.hseq : (v.mmsi||'MMSI —');})()}</span><span>${sub}</span></div>
      <div class="lt">${lt?`<b>${lt.hm}</b>${lt.tz}`:'—'}</div></div>`;
  };
  document.getElementById('list').innerHTML =
    (onMap.length?`<div class="sec">항해 · 정박 중 (${onMap.length})<span class="lth">현지시간</span></div>`+onMap.map(row).join(''):'')
    +(standby.length?`<div class="sec">대기 — AIS 미수신 (${standby.length})</div>`+standby.map(row).join(''):'')
    +(!show.length?'<div style="padding:20px;color:var(--muted)">검색 결과 없음</div>':'');
}

function focusV(no){
  const v=vessels.find(x=>x.no===no);
  soloNo = (soloNo===no) ? null : no;              // 같은 선박 재클릭 시 전체 복귀
  if(!shipsOn && soloNo!=null){
    shipsOn = true;
    const st=document.getElementById('stoggle'); if(st) st.classList.add('on');
  }
  render();
  if(soloNo!=null && v && v.lat!=null){
    var dxy=(v.data&&v.data.destination)?destLatLng(v.data.destination):null;
    var far=dxy?nmDist(v.lat,v.lon,dxy[0],dxy[1]):0;
    if(dxy && far>25){
      var dl=dxy[1]; if(dl-v.lon>180) dl-=360; if(v.lon-dl>180) dl+=360;
      var pad = far>2500 ? 40 : far>600 ? 70 : 100;          // \uAC70\uB9AC\uBCC4 \uC5EC\uBC31
      map.flyToBounds([[v.lat,v.lon],[dxy[0],dl]],{padding:[pad,pad],maxZoom:9,duration:1.1});
    }
    else map.flyTo([v.lat,v.lon], Math.max(map.getZoom(),8), {duration:.9});
    setTimeout(()=>{ markers[no] && markers[no].openPopup(); }, 950);
  }
  if(innerWidth<=760) document.getElementById('side').classList.remove('open');
}

var BUILD='2026-09-11T13:40Z', lastOK=null, failCount=0;
function setHealth(state, txt){

  el.innerHTML = '<span class="dot" style="background:'+c+'"></span>'+txt;
  el.style.borderColor = state==='ok' ? 'var(--line)' : c;
}
function ageTxt(ms){ var m=Math.round(ms/60000); return m<60 ? m+'\uBD84' : (m/60).toFixed(1)+'\uC2DC\uAC04'; }
function healthFromData(){
  if(!store.updated){ setHealth('err','\uB370\uC774\uD130 \uC5C6\uC74C'); return; }
  var age = Date.now() - new Date(store.updated).getTime();
  if(!isFinite(age)) { setHealth('warn','\uC2DC\uAC01 \uD655\uC778 \uBD88\uAC00'); return; }
  if(age < 95*60e3) setHealth('ok','\uC815\uC0C1 \u00b7 '+ageTxt(age)+' \uC804 \uC218\uC9D1');
  else if(age < 6*3600e3) setHealth('warn','\uC218\uC9D1 \uC9C0\uC5F0 \u00b7 '+ageTxt(age)+' \uACBD\uACFC');
  else setHealth('err','\uC218\uC9D1 \uC911\uB2E8 \uC758\uC2EC \u00b7 '+ageTxt(age)+' \uACBD\uACFC');
}
async function fetchJSON(url, tries){
  for(var i=0;i<tries;i++){
    try{
      var r = await fetch(url+(url.indexOf('?')>=0?'&':'?')+'t='+Date.now(), {cache:'no-store'});
      if(r.ok){ var j = await r.json(); if(j) return j; }
    }catch(e){}
    await new Promise(function(s){ setTimeout(s, 1200*(i+1)); });
  }
  return null;
}
async function load(){
  fleet = FLEET;
  if(!vessels.length){ try{ render(); }catch(e){} }
  var data = await fetchJSON('fleet-positions.json', 3);
  if(data && data.vessels){

/* ── 항적에서 기항지 추정: 정지 구간 → 최근접 항구 ── */
function nearestPort(la, lo){
  var best=null, bd=1e9, byIdx=null;
  for(var k in PORTXY){ var p=PORTXY[k], d=nmDist(la,lo,p[0],p[1]); if(d<bd){ bd=d; best=k; byIdx=null; } }
  if(window.portData && portData.ports){
    portData.ports.forEach(function(p){ if(p.lat==null) return; var d=nmDist(la,lo,p.lat,p.lon); if(d<bd){ bd=d; best=null; byIdx=p.port+", "+p.country; } });
  }
  if(best){ var nmv=LOCODE[best], cc=CC[best.slice(0,2)]; return {name:(nmv?nmv+(cc?", "+cc:""):best), dist:bd}; }
  if(byIdx) return {name:byIdx, dist:bd};
  return null;
}
function detectCalls(pts){
  var out=[], i=0;
  function moving(p, prev){
    if(p[3]!=null) return p[3] >= 1.0;
    if(!prev) return true;
    var dt=(new Date(p[0])-new Date(prev[0]))/3600e3;
    return dt>0 ? (nmDist(prev[1],prev[2],p[1],p[2])/dt) >= 1.0 : true;
  }
  while(i<pts.length){
    if(moving(pts[i], pts[i-1])){ i++; continue; }
    var s=i; while(i<pts.length && !moving(pts[i], pts[i-1])) i++;
    var e=i-1;
    var hrs=(new Date(pts[e][0])-new Date(pts[s][0]))/3600e3;
    if(hrs < 2.5) continue;
    var la=0, lo=0, n=0;
    for(var k=s;k<=e;k++){ la+=pts[k][1]; lo+=pts[k][2]; n++; }
    la/=n; lo/=n;
    var np=nearestPort(la,lo);
    out.push({from:pts[s][0], to:pts[e][0], hrs:hrs, lat:la, lon:lo,
              port:(np && np.dist<=35)?np.name:null, dist:np?np.dist:null,
              berth:!!(np && np.dist<=6)});
  }
  return out;
}
var TRKC={};
async function loadCalls(v){
  var el=document.getElementById('pc_'+v.no); if(!el) return;
  var key=(v.mmsi)||(v.data&&v.data.imo)||'';
  if(!key){ el.innerHTML='<span class="pcn">\uD56D\uC801 \uC5C6\uC74C</span>'; return; }
  try{
    var pts=TRKC[key];
    if(!pts){ var r=await fetch('tracks/'+key+'.json?t='+Date.now());
      if(!r.ok) throw new Error('no track');
      var d2=await r.json(); pts=d2.points||[]; TRKC[key]=pts; }
    if(pts.length<3){ el.innerHTML='<span class="pcn">\uD56D\uC801 \uB370\uC774\uD130 \uBD80\uC871</span>'; return; }
    var cs=detectCalls(pts).slice(-4).reverse();
    if(!cs.length){ el.innerHTML='<span class="pcn">\uCD5C\uADFC \uAE30\uD56D \uC5C6\uC74C \u00b7 \uC5F0\uC18D \uD56D\uD574</span>'; return; }
    el.innerHTML=cs.map(function(c){
      var ic=c.port?(c.berth?'\u2693':'\u23F8'):'\u25CB';
      var nm=c.port||'\uBBF8\uC0C1 \uC815\uC9C0\uC9C0';
      var du=c.hrs<24?c.hrs.toFixed(1)+'h':(c.hrs/24).toFixed(1)+'\uC77C';
      return '<div class="pcr">'+ic+' <b>'+nm+'</b> <span>'+fmtD(c.from)+' \u00b7 '+du+'</span></div>';
    }).join('');
  }catch(e){ el.innerHTML='<span class="pcn">\uD56D\uC801 \uB370\uC774\uD130 \uC5C6\uC74C</span>'; }
}
function renderCalls(calls){
  var el=document.getElementById('trkcalls'); if(!el) return;
  if(!calls.length){ el.innerHTML='<div class="hh">기항 이력 없음 (연속 항해)</div>'; return; }
  var rows=calls.map(function(c){
    var ic = c.port ? (c.berth ? '\u2693' : '\u23F8') : '\u25CB';
    var nm = c.port ? c.port : '미상 정지지';
    var tag = c.port ? (c.berth ? '항내/접안' : '묘박·대기 '+Math.round(c.dist)+'nm') : (c.dist!=null?Math.round(c.dist)+'nm 이격':'');
    var dur = c.hrs<24 ? c.hrs.toFixed(1)+'h' : (c.hrs/24).toFixed(1)+'일';
    return '<div class="cl '+(c.berth?'anch':'')+'"><div class="ic">'+ic+'</div><div><div class="pn">'+nm+'</div>'
      +'<div class="tm">'+fmtD(c.from)+' ~ '+fmtD(c.to)+' \u00b7 '+dur+' \u00b7 '+tag+'</div></div></div>';
  }).join('');
  el.innerHTML='<div class="hh">기항·정지 이력 '+calls.length+'건 (추정)</div>'+rows;
}
function drawTrack(){
  if(!TRK) return;
  let a=parseInt(document.getElementById('trkfrom').value,10), b=parseInt(document.getElementById('trkto').value,10);
  if(a>b){ const z=a; a=b; b=z; }
  const pts=TRK.points.slice(a,b+1);
  trkLayer.clearLayers();
  if(pts.length<2){ document.getElementById('trkinfo').textContent='\uad6c\uac04\uc744 \ub118\ud790\uac8c \uc124\uc815\ud558\uc138\uc694'; return; }
  const line=pts.map(p=>[p[1],p[2]]);
  L.polyline(line,{color:'#0B1220',weight:6,opacity:.5,pane:'portsPane',interactive:false}).addTo(trkLayer);
  L.polyline(line,{color:'#F0B95A',weight:2.5,opacity:.95,pane:'portsPane',interactive:false}).addTo(trkLayer);
  const step=Math.max(1,Math.floor(pts.length/40));
  for(let i=0;i<pts.length;i+=step){
    const p=pts[i];
    L.circleMarker([p[1],p[2]],{radius:2.6,stroke:false,fillColor:'#F0B95A',fillOpacity:.9,pane:'portsPane'})
      .bindTooltip(fmtD(p[0])+' \u00b7 '+(p[3]!=null?p[3].toFixed(1)+'kn':'-'),{className:'plabel'}).addTo(trkLayer);
  }
  L.circleMarker(line[0],{radius:5,color:'#06101C',weight:1.5,fillColor:'#3DDC97',fillOpacity:1,pane:'portsPane'}).bindTooltip('START '+fmtD(pts[0][0]),{className:'plabel'}).addTo(trkLayer);
  L.circleMarker(line[line.length-1],{radius:5,color:'#06101C',weight:1.5,fillColor:'#E0703C',fillOpacity:1,pane:'portsPane'}).bindTooltip('END '+fmtD(pts[pts.length-1][0]),{className:'plabel'}).addTo(trkLayer);
  let nm=0; for(let i=1;i<line.length;i++){ nm += map.distance(line[i-1],line[i])/1852; }
  const hrs=(new Date(pts[pts.length-1][0])-new Date(pts[0][0]))/3600e3;
  document.getElementById('trkinfo').innerHTML='<b>'+fmtD(pts[0][0])+'</b> \u2192 <b>'+fmtD(pts[pts.length-1][0])+'</b> \u00b7 '+pts.length+'pts \u00b7 '+Math.round(nm)+' NM \u00b7 '+(hrs>0?(nm/hrs).toFixed(1):'0')+' kn avg';
  try{
    var calls=detectCalls(pts);
    renderCalls(calls);
    calls.forEach(function(c){
      L.circleMarker([c.lat,c.lon],{radius:c.berth?7:5.5,color:'#06101C',weight:1.5,fillColor:c.berth?'#F0B95A':'#8CA0B8',fillOpacity:.95,pane:'portsPane'})
       .bindTooltip((c.port||'\uBBF8\uC0C1 \uC815\uC9C0\uC9C0')+' \u00b7 '+(c.hrs<24?c.hrs.toFixed(1)+'h':(c.hrs/24).toFixed(1)+'\uC77C'),{className:'plabel'}).addTo(trkLayer);
    });
  }catch(e){}
  map.fitBounds(line,{padding:[60,60]});
}

  var lg=(typeof destLegs==='function')?destLegs(t):[String(t||'')];
  var raw=String(lg[0]||'').trim(); if(!raw) return null;
  var k=raw.toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(PORTXY[k]) return PORTXY[k];
  var nm=(typeof LOCODE!=="undefined"&&LOCODE[k])?LOCODE[k]:raw, u=String(nm).toUpperCase();
  if(window.portData && portData.ports){
    var hit=portData.ports.filter(function(p){return p.lat!=null && p.port.toUpperCase()===u;})[0] ||
            portData.ports.filter(function(p){return p.lat!=null && p.port.length>3 && u.indexOf(p.port.toUpperCase())>=0;})[0];
    if(hit) return [hit.lat,hit.lon];
  }
  return null;
}
function nmDist(a,b,c,d){var R=3440.065,r=Math.PI/180;
  var x=Math.sin((c-a)*r/2), y=Math.sin((d-b)*r/2);
  return 2*R*Math.asin(Math.sqrt(x*x+Math.cos(a*r)*Math.cos(c*r)*y*y));}
var destLayer=L.layerGroup().addTo(map);
function drawDest(v){
  destLayer.clearLayers();
  if(!v||!v.data||!v.data.destination||v.lat==null) return null;
  var xy=destLatLng(v.data.destination); if(!xy) return null;
  var dlon=xy[1]; if(dlon-v.lon>180) dlon-=360; if(v.lon-dlon>180) dlon+=360;
  var P=[xy[0],dlon];
  L.polyline([[v.lat,v.lon],P],{color:'#F0B95A',weight:2,opacity:.7,dashArray:'9 7',pane:'shipsPane',interactive:false}).addTo(destLayer);
  var svg='<svg class="destmk" width="36" height="36" viewBox="0 0 36 36">'

   +'<line x1="3" y1="18" x2="9" y2="18" stroke="#F0B95A" stroke-width="1.6"/><line x1="27" y1="18" x2="33" y2="18" stroke="#F0B95A" stroke-width="1.6"/>'
   +'<circle cx="18" cy="18" r="3.6" fill="#F0B95A" stroke="#1A1204" stroke-width="1"/></svg>';
  var mk=L.marker(P,{icon:L.divIcon({html:svg,className:'',iconSize:[36,36],iconAnchor:[18,18]}),pane:'shipsPane'}).addTo(destLayer);
  var d=Math.round(nmDist(v.lat,v.lon,xy[0],xy[1]));
  var eta=fmtEta(v.data.eta);
  mk.bindTooltip('\u25B6 '+destFull(v.data.destination)+'  \u00b7  \uC9C1\uC120 '+d.toLocaleString()+' nm'+(eta?'  \u00b7  ETA '+eta+' UTC':''),
    {permanent:true,direction:'top',offset:[0,-18],className:'destlbl',opacity:1});
  return P;
}
function parseLL(text){
  var out=[], lines=String(text||'').split(/[\r\n;]+/);
  for(var li=0; li<lines.length; li++){
    var s=lines[li].toUpperCase().replace(/[\u00B0\u00BA\u02DA\u2032\u2033\u2018\u2019\u201C\u201D'\"]/g,' ').trim(); if(!s) continue;
    var got=null;
    if(/[NSEW]/.test(s)){
      var re=/([NSEW])\s*([0-9]{1,7}(?:[^0-9NSEW]+[0-9.]+)*)|([0-9]{1,7}(?:[^0-9NSEW]+[0-9.]+)*)\s*([NSEW])/g, m, vals=[];
      while((m=re.exec(s))!==null){
        var hemi=m[1]||m[4], num=(m[2]||m[3]||'').trim();
        if(!hemi||!num) continue;
        var isLat=(hemi==='N'||hemi==='S');
        var parts=num.split(/[^0-9.]+/).filter(function(x){return x!=='';});
        var deg,min=0,sec=0;
        if(parts.length===1 && parts[0].indexOf('.')<0){
          var d=parts[0];
          if(isLat){
            if(d.length<=2){deg=+d;}
            else if(d.length===4){deg=+d.slice(0,2);min=+d.slice(2);}
            else if(d.length===6){deg=+d.slice(0,2);min=+d.slice(2,4);sec=+d.slice(4);}
            else {deg=+d;}
          } else {
            if(d.length<=3){deg=+d;}
            else if(d.length===4){deg=+d.slice(0,2);min=+d.slice(2);}
            else if(d.length===5){deg=+d.slice(0,3);min=+d.slice(3);}
            else if(d.length===7){deg=+d.slice(0,3);min=+d.slice(3,5);sec=+d.slice(5);}
            else {deg=+d;}
          }
        } else {
          deg=parseFloat(parts[0])||0; min=parts[1]?parseFloat(parts[1]):0; sec=parts[2]?parseFloat(parts[2]):0;
        }
        var v=Math.abs(deg)+min/60+sec/3600;
        if(hemi==='S'||hemi==='W') v=-v;
        vals.push({v:v,isLat:isLat});
      }
      var la=vals.filter(function(x){return x.isLat;})[0], lo=vals.filter(function(x){return !x.isLat;})[0];
      if(la&&lo) got={lat:la.v, lon:lo.v};
    } else {
      var nums=s.match(/-?\d+(?:\.\d+)?/g);
      if(nums&&nums.length>=2) got={lat:parseFloat(nums[0]), lon:parseFloat(nums[1])};
    }
    if(got && isFinite(got.lat) && isFinite(got.lon) && Math.abs(got.lat)<=90 && Math.abs(got.lon)<=180)
      out.push({lat:got.lat, lon:got.lon, raw:lines[li].trim()});
  }
  return out;
}
var wpLayer=L.layerGroup().addTo(map);
function wpIcon(){ return L.divIcon({className:'',iconSize:[28,28],iconAnchor:[14,14],html:
  '<svg width="28" height="28" viewBox="0 0 28 28">'

function addWP(list){
  var pts=[];
  list.forEach(function(p){
    var mk=L.marker([p.lat,p.lon],{icon:wpIcon(),pane:'shipsPane'}).addTo(wpLayer);
    mk.bindTooltip(dm(p.lat,true)+'  '+dm(p.lon,false),{permanent:true,direction:'top',offset:[0,-14],className:'wplbl',opacity:1});

      +'<tr><td>\uC2ED\uC9C4\uB3C4</td><td>'+p.lat.toFixed(4)+', '+p.lon.toFixed(4)+'</td></tr>'
      +'<tr><td>\uC785\uB825\uAC12</td><td>'+p.raw+'</td></tr></table></div>');

  else if(pts.length>1) map.fitBounds(pts,{padding:[70,70],maxZoom:7});

}
function portColor(p){ return p.security > p.general ? '#E0703C' : '#5AB8D6'; }
function enc(s){ return encodeURIComponent(s).replace(/'/g,'%27'); }
function langQ(){ return (typeof UILANG!=='undefined' && UILANG==='en') ? '&lang=en' : ''; }
function openPort(p){ window.open('ports.html?port='+p+langQ(),'_blank'); }
function openCountry(c){ window.open('ports.html?country='+c+langQ(),'_blank'); }

let PMARKS = [];
function labelMode(){
  const z = map.getZoom();
  return z >= 5 ? 'all' : z >= 4 ? 'major' : 'none';   // 줌에 따라 라벨 노출 단계
}
function applyPortLabels(){
  const z = map.getZoom(), c = map.getContainer();
  c.classList.toggle('zl3', z>=3);
  c.classList.toggle('zl4', z>=4);
  c.classList.toggle('zl5', z>=5);
}
function _legacyPortLabels(){
  const mode = labelMode();
  PMARKS.forEach(({m,p,n})=>{
    const show = mode==='all' || (mode==='major' && n>=4);
    m.unbindTooltip();
    m.bindTooltip(p.port,{permanent:show,direction:'top',offset:[0,-7],
      className:'plabel'+(p.security>p.general?' sec':''), opacity:1});
  });
}
map.on('zoomend', applyPortLabels);
function renderPorts(){
  portLayer.clearLayers(); PMARKS = [];
  if(!portsOn || !portData) return;
  const sel = document.getElementById('csel') ? document.getElementById('csel').value : '';
  portData.ports.forEach(p=>{
    if(p.lat==null) return;
    if(sel && p.country!==sel) return;
    const n = p.items.length;
    const sec = p.security > p.general;
    const r = Math.max(5, Math.min(4+Math.sqrt(n)*1.9, 12));
    L.circleMarker([p.lat,p.lon],{                       // 외곽 글로우
      radius: r+3.5, stroke:false, fillColor: portColor(p), fillOpacity:.14,
      pane:'portsPane', interactive:false
    }).addTo(portLayer);
    const m = L.circleMarker([p.lat,p.lon],{
      radius: r,
      color: sec ? '#FFD9C6' : '#CDEBF7', weight:1.1, opacity:.75,
      fillColor: portColor(p), fillOpacity: p.isCountry?.4:.9,
      dashArray: p.isCountry ? '2 3' : null,
      pane:'portsPane'
    }).addTo(portLayer);
    m.on('mouseover', function(){ this.setStyle({weight:2.2, opacity:1});
      var t=this.getTooltip&&this.getTooltip(), el=t&&t.getElement&&t.getElement(); if(el) el.classList.add('hov'); });
    m.on('mouseout',  function(){ this.setStyle({weight:1.1, opacity:.75});
      var t=this.getTooltip&&this.getTooltip(), el=t&&t.getElement&&t.getElement(); if(el) el.classList.remove('hov'); });
    m.bindTooltip(p.port,{permanent:true,direction:'top',offset:[0,-7],
      className:'plabel'+(sec?' sec':'')+(n>=4?' major':''),opacity:1});
    PMARKS.push({m,p,n});
    m.bindPopup(`<div class="pop"><b class="t">⚓ ${p.port}</b>
      <div style="font-family:var(--mono);font-size:11px;color:#8CA0B8;margin-bottom:6px">${p.country} · 일반 ${p.general} · 보안 ${p.security}</div>
      <button class="pbtn" onclick="openPort('${enc(p.port)}')">이 항구 정보 보기 →</button>
      <button class="pbtn co" onclick="openCountry('${enc(p.country)}')">${p.country} 전체 보기 →</button></div>`);
  });
  applyPortLabels();
}

fetch('ports-data.json?t='+Date.now()).then(r=>r.json()).then(d=>{
  portData = d;
  // 국가 선택 드롭다운 + 항구 토글을 헤더에 삽입
  const wrap = document.getElementById('ctrlbar');
  wrap.insertAdjacentHTML('beforeend',
    `<div class="chip" id="ptoggle">⚓ 항구 정보 <b>${d.ports.filter(p=>p.lat!=null).length}</b></div>
     <select id="csel" style="background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-family:var(--mono);font-size:12px">
       <option value="">국가: 전체</option>
       ${d.countries.map(c=>`<option value="${c.country}">${c.country} (${c.general+c.security})</option>`).join('')}
     </select>
     <div class="chip" id="copen" style="display:none">국가 정보 열기 →</div>`);
  wrap.appendChild(document.getElementById('tghint'));
  document.getElementById('ptoggle').onclick = function(){
    portsOn=!portsOn; this.classList.toggle('on',portsOn);
    document.getElementById('csel').style.display = portsOn ? '' : 'none';
    if(!portsOn) document.getElementById('copen').style.display='none';
    renderPorts();
  };
  document.getElementById('csel').style.display = portsOn ? '' : 'none';
  document.getElementById('csel').onchange = function(){
    const v=this.value;
    document.getElementById('copen').style.display = v?'flex':'none';
    renderPorts();
    if(v && portData){
      const pts = portData.ports.filter(p=>p.country===v && p.lat!=null);
      if(pts.length){ map.fitBounds(pts.map(p=>[p.lat,p.lon]),{padding:[50,50],maxZoom:6}); }
    }
  };
  document.getElementById('copen').onclick = function(){
    const v=document.getElementById('csel').value;
    if(v) window.open('ports.html?country='+enc(v)+langQ(),'_blank');
  };
  renderPorts();
}).catch(e=>console.log('port data not ready:', e.message));

const EN_PAIRS = [

].sort((a,b)=>b[0].length-a[0].length);
const KOMEM = new WeakMap();
function xlate(n){
  if(n.nodeType===3){
    let s=n.nodeValue, o=s;
    for(const [k,e] of EN_PAIRS){ if(s.indexOf(k)>=0) s=s.split(k).join(e); }
    if(s!==o){ if(!KOMEM.has(n)) KOMEM.set(n,o); n.nodeValue=s; }
  } else if(n.nodeType===1 && n.id!=='langbtn'){
    for(const c of n.childNodes) xlate(c);
  }
}
function unxlate(n){
  if(n.nodeType===3){ if(KOMEM.has(n)) n.nodeValue=KOMEM.get(n); }
  else if(n.nodeType===1){ for(const c of n.childNodes) unxlate(c); }
}
const LOBS = new MutationObserver(ms=>{
  if(UILANG!=='en') return;
  ms.forEach(m=>{
    if(m.type==='characterData') xlate(m.target);
    m.addedNodes && m.addedNodes.forEach(xlate);
  });
});
function toggleLang(){
  UILANG = UILANG==='ko' ? 'en' : 'ko';
  document.getElementById('langbtn').textContent = UILANG==='ko' ? '\ud83c\udf10 English' : '\ud83c\udf10 \ud55c\uae00';
  const q = document.getElementById('q');
  if(UILANG==='en'){
    xlate(document.body);
    LOBS.observe(document.body,{childList:true,subtree:true,characterData:true});
    if(q) q.placeholder='Search vessel · MMSI';
  } else {
    LOBS.disconnect();
    unxlate(document.body);
    if(q) q.placeholder='\uc120\ubc15\uba85 \u00b7 MMSI \uac80\uc0c9';
  }
}
